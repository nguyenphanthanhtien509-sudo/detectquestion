[env:esp32s3_usb_gateway]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:scripts/validate_flash_layout.py
; COM7 verified: ESP32-S3 rev v0.2, 4 MB flash, 2 MB PSRAM.
; Firmware uses a 4 MB layout and requires the onboard 2 MB QSPI PSRAM.
upload_port = COM7
monitor_port = COM7
board_upload.flash_size = 4MB
; Must match factory offset in partitions.csv; Arduino defaults to 0x10000.
board_upload.offset_address = 0x20000
board_build.flash_mode = dio
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; Assumed onboard WS2812 RGB LED on GPIO48; adjust for board variants.
    -DGATEWAY_LED_PIN=48
    -DGATEWAY_LED_RGB=1
    -DGATEWAY_LED_ACTIVE_LOW=0
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5

